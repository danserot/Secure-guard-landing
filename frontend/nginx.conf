# Loaded inside nginx's http context by the official image.
limit_req_zone $binary_remote_addr zone=sg_client:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=sg_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sg_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sg_vision:1m rate=2r/s;
limit_req_zone $server_name zone=sg_global:1m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=sg_connections:10m;
limit_conn_zone $server_name zone=sg_total_connections:1m;

map $http_upgrade $sg_connection_upgrade {
    default upgrade;
    '' close;
}
map $status $sg_retry_after {
    default '';
    429 60;
}
map $uri $sg_cache_control {
    default 'no-cache';
    ~^/assets/ 'public, max-age=31536000, immutable';
    ~^/(brand/|favicon-|apple-touch-icon) 'public, max-age=86400';
    ~^/api/ 'no-store';
}
# Original URI survives try_files' internal SPA rewrite to index.html.
# The dashboard's camera/WASM/API requirements differ from the landing.
map $request_uri $sg_landing_csp {
    default '';
    ~^/landing/?(\?|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    large_client_header_buffers 2 8k;
    reset_timedout_connection on;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    limit_conn sg_connections 32;
    limit_conn sg_total_connections 512;
    limit_req zone=sg_global burst=400 nodelay;
    limit_req zone=sg_client burst=80 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(self), microphone=(), geolocation=()' always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy $sg_landing_csp always;
    add_header Cache-Control $sg_cache_control always;
    add_header Retry-After $sg_retry_after always;

    # Docker DNS; never trust arbitrary client X-Forwarded-For headers.
    # A missing optional backend must not prevent the static landing starting.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $secureguard_backend http://backend:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sg_connection_upgrade;
    proxy_hide_header X-Powered-By;

    location = /healthz {
        access_log off;
        default_type text/plain;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 200 "healthy\n";
    }
    location = /api/auth/login {
        limit_req zone=sg_global burst=400 nodelay;
        limit_req zone=sg_login burst=5 nodelay;
        if ($request_method != POST) { return 405; }
        proxy_pass $secureguard_backend;
    }
    location = /api/vision/infer {
        limit_req zone=sg_global burst=400 nodelay;
        limit_req zone=sg_vision burst=3 nodelay;
        client_max_body_size 4m;
        proxy_read_timeout 120s;
        proxy_pass $secureguard_backend;
    }
    location ^~ /api/ {
        limit_req zone=sg_global burst=400 nodelay;
        limit_req zone=sg_api burst=30 nodelay;
        # Preserve authenticated evidence upload size.
        client_max_body_size 34m;
        proxy_pass $secureguard_backend;
    }
    location /vision/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* \.(log|sql|dump|bak|env|ini|ya?ml|toml|map)$ { return 404; }
    location ~* \.(js|mjs|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4|webm|txt|json|wasm)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ /index.html;
    }
}
